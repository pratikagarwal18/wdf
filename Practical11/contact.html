<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Portal</h1>
    <hr>

    <h2>Contact Us</h2>

    <form>

        <table cellpadding="10">

            <tr>
                <td><b>Full Name</b></td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td><b>Email</b></td>
                <td><input type="email" placeholder="Enter your email"></td>
            </tr>

            <tr>
                <td><b>Phone Number</b></td>
                <td><input type="tel" placeholder="Enter your phone number"></td>
            </tr>

            <tr>
                <td><b>Subject</b></td>
                <td><input type="text" placeholder="Enter subject"></td>
            </tr>

            <tr>
                <td><b>Message</b></td>
                <td>
                    <textarea rows="5" cols="30" placeholder="Write your message"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="submit" value="Send Message">
                    <input type="reset" value="Clear">
                </td>
            </tr>

        </table>

    </form>

    <hr>

    <h3>College Contact Details</h3>

    <p><b>Address:</b> Depstar College, near vadtal, Anand</p>
    <p><b>Email:</b> p301@gmail.com</p>
    <p><b>Phone:</b> +91 9876543210</p>

    <script src="script.js" defer></script>
</body>
</html>
