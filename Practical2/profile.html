<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>
</head>

<body  style="background-color: rgb(209, 229, 246)">

    <h1 align="center" style="background-color: rgb(11, 22, 230); color : white; padding : 10px">Student Portal</h1>
    <hr>

    <h2>Welcome</h2>
    <p>Welcome to the Student Portal Website.</p>

    <h2>Student Details</h2>

    <table border="2" cellpadding="10">
        <tr>
            <td><b>Full Name</b></td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td><b>Enrollment ID</b></td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td><b>Branch</b></td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td><b>Date of Birth</b></td>
            <td><input type="date"></td>
        </tr>

        <tr>
            <td><b>Contact Number</b></td>
            <td><input type="tel"></td>
        </tr>

        <tr>
            <td><b>Address</b></td>
            <td><textarea rows="3" cols="30"></textarea></td>
        </tr>

        <tr>
            <td><b>Nationality</b></td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td><b>Mother Tongue</b></td>
            <td><input type="text"></td>
        </tr>
    </table>

    <br>

    <input type="button" value="Edit">
    <input type="submit" value="Save">

</body>
</html>
