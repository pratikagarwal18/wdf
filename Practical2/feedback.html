<html>
    <head>
        <title>feedback</title>
    </head>
    <body  style="background-color: rgb(209, 229, 246)">
        <h1 align="center" style="background-color: rgb(11, 22, 230); color : white; padding : 10px">Student Portal</h1>
    <hr>

    <h2 align="center"  style="background-color: rgb(72, 59, 250); color:rgb(247, 243, 243); padding:10px">feedback</h2>
    <hr>
    <form>
        
    <label><b>1. How would you rate your overall experience with the Student Hub Portal?</b></label><br>
    <input type="radio" name="rating"> Excellent
    <input type="radio" name="rating"> Good
    <input type="radio" name="rating"> Average
    <input type="radio" name="rating"> Poor
    <br><br>

    <label><b>2. Was the website easy to navigate?</b></label><br>
    <input type="radio" name="navigation"> Yes
    <input type="radio" name="navigation"> No
    <br><br>

    <label><b>3. Which feature did you find most useful?</b></label><br>
    <select>
        <option>Profile</option>
        <option>Attendance</option>
        <option>Assignments</option>
        <option>Course Information</option>
        <option>Results</option>
    </select>
    <br><br>

    <label><b>4. What did you like about the website?</b></label><br>
    <textarea rows="4" cols="50" placeholder="Share your experience..."></textarea>
    <br><br>

    <label><b>5. What improvements would you suggest?</b></label><br>
    <textarea rows="4" cols="50" placeholder="Example: Better colors, improved layout, faster loading, etc."></textarea>
    <br><br>

    <label><b>6. Would you recommend this portal to other students?</b></label><br>
    <input type="radio" name="recommend"> Yes
    <input type="radio" name="recommend"> No
    <br><br>

    <input type="submit" value="Submit Feedback">
    <input type="reset" value="Clear">
    </form>
