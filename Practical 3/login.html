<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Student Hub Login</h2>

    <form>
        <label>Student ID:</label><br>
        <input type="text" placeholder="Enter Student ID"><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter Password" id="passwordField">
        <button type="button" id="toggleButton" onclick="togglePassword()">Show</button>
        <script src="script.js"></script><br><br>

        <input type="submit" value="Login">
        <input type="reset" value="Clear">
    </form>

    <br>

    <a href="register.html">Register</a> |
    <a href="#">Forgot Password?</a>

</body>
</html>
