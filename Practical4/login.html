<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Student Hub Login</h2>

    <form id="loginForm">
        <div id="loginNotification" style="display: none;"></div>

        <label for="studentId">Student ID:</label><br>
        <input type="text" id="studentId" placeholder="Enter Student ID" value="STU2025-042" required><br><br>

        <label for="passwordField">Password:</label><br>
        <div class="password-wrapper">
            <input type="password" placeholder="Enter Password" id="passwordField" required>
            <button type="button" id="toggleButton" onclick="togglePassword()">Show</button>
        </div><br>

        <input type="submit" value="Login">
        <input type="reset" value="Clear">
    </form>

    <br>

    <p style="text-align: center;">
        <a href="register.html">Register</a> |
        <a href="#">Forgot Password?</a>
    </p>

    <script src="script.js" defer></script>
</body>
</html>
